services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: briefly
      POSTGRES_PASSWORD: briefly
      POSTGRES_DB: briefly
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
